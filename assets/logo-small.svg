<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">AppleRPC logo: a music note broadcasting a signal</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18213A"/>
      <stop offset="1" stop-color="#0B0F1A"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2FE3B4"/>
      <stop offset="1" stop-color="#3DB8FF"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DB8FF"/>
      <stop offset="1" stop-color="#7C8CFF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- note: stem first, then the head on top so the join is clean -->
  <rect x="216" y="200" width="40" height="176" rx="20" fill="url(#note)"/>
  <ellipse cx="166" cy="376" rx="82" ry="62" transform="rotate(-24 166 376)" fill="url(#note)"/>
  <!-- signal waves leaving the top of the stem -->
  <path d="M 284.0 138.5 A 78 78 0 0 1 284.0 261.5" stroke="url(#wave)" stroke-opacity="1" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M 323.4 88.1 A 142 142 0 0 1 323.4 311.9" stroke="url(#wave)" stroke-opacity="0.7" stroke-width="40" stroke-linecap="round" fill="none"/>
  <circle cx="236" cy="200" r="24.8" fill="url(#note)"/>
</svg>
